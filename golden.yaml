      - paragraph: {start: "Reversing the historical trend in emissions", end: "high-efficiency goods and services expand."}
      - paragraph: {start: "Greenhouse-gas emissions can be cut in", end: "used, and in which sector:"}
      - list: {start: "Reducing demand for emissions-intensive goods and", end: "for power, heat and transport", items: 4}
      - paragraph: {start: "Estimating the costs of these changes", end: "for high-carbon goods and services."}
    markers: []
  # Figure 4 (a scatter plot) under its two-line title; the Source line; body.
  - pdf: 15
    verified_by: "Claude (Opus 5.5), 2026-11-08, against the page image"
    blocks:
      - paragraph: {start: "Figure 4 Model cost projections scatter", end: "GDP against level of reduction"}
      - paragraph: {start: "Source: Barker, T., M.S. Qureshi and", end: "Research, Cambridge: University of Cambridge."}
      - paragraph: {start: "A broad range of modelling studies,", end: "the degree of policy flexibility."}
      - paragraph: {start: "The figure above uses Barker's combined", end: "very pessimistic by historical standards."}
      - paragraph: {start: "Stabilisation at 450ppm CO2e is already", end: "likely to be very costly."}
      - paragraph: {start: "An important corollary is that there", end: "already associated with significant risks."}
    markers: []
  # Two bold-italic findings, body paragraphs; the last runs on to p.17.
  - pdf: 16
    verified_by: "Claude (Opus 5.5), 2026-11-08, against the page image"
    blocks:
      - paragraph: {start: "***The transition to a low-carbon economy", end: "but also opportunities for growth.***"}
      - paragraph: {start: "Costs of mitigation of around 1%", end: "dynamism to embrace the change."}
      - paragraph: {start: "There are also significant new opportunities", end: "take advantage of these opportunities."}
      - paragraph: {start: "Climate-change policy can help to root", end: "spend around $250bn a year."}
